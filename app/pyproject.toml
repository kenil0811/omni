[project]
name = "alpha-workspace"
version = "0.0.0"
description = "Alpha implementation workspace"
requires-python = ">=3.13"
dependencies = [
    "app-sdk-python",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.6",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
app-sdk-python = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["fixtures", "packages", "tools"]
python_files = ["test_*.py", "*_test.py"]
# Each fixture has its own oracle_test.py; importlib mode keeps the identical
# basenames from colliding.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
